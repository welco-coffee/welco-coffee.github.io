# GitHub Pages를 Actions 방식으로 빌드·배포한다.
# 레거시(Deploy from a branch) 빌드가 원인 없이 실패할 때의 대안이며,
# 이쪽은 실패 시 실제 로그를 볼 수 있다.
# ※ 이 파일을 push 하려면 토큰에 workflow 권한이 필요하다:  gh auth refresh -s workflow

name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
